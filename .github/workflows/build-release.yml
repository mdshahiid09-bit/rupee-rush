name: Rupee Rush Release Build & Test

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run Unit Tests
        run: |
          gradle testReleaseUnitTest

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Creating temporary build keystore for artifact creation..."
            keytool -genkeypair -noprompt \
              -keystore release.keystore \
              -storepass android \
              -alias rupeerush \
              -keypass android \
              -dname "CN=Rupee Rush,O=RupeeRush,C=IN" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'rupeerush' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        run: |
          gradle assembleRelease

      - name: Generate SHA-256 Checksum
        run: |
          cd app/build/outputs/apk/release/
          sha256sum app-release.apk > app-release.apk.sha256
          echo "SHA256 Checksum: $(cat app-release.apk.sha256)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RupeeRush-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
